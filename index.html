<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#54705b" />
    <meta name="description" content="示例宝宝的喂养、用药、排便与日常照护记录" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <title>宝宝照护记录</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #f7f7f0; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #1a1f1b; }
      .boot-shell { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: #5e6d62; font: 14px/1.5 Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .boot-shell i { width: 28px; height: 28px; border: 3px solid #d9dfd7; border-top-color: #526d59; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      html[data-theme="dark"] .boot-shell { color: #a7b0a8; }
      html[data-theme="dark"] .boot-shell i { border-color: #3d4941; border-top-color: #86a370; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-shell i { animation-duration: 1.8s; } }
    </style>
    <script>
      (() => {
        try {
          const mql = window.matchMedia('(prefers-color-scheme: dark)');
          const resolveTheme = () => {
            const stored = localStorage.getItem('babycare-theme');
            if (stored === 'dark' || stored === 'light') return stored;
            if (stored === 'system') return mql.matches ? 'dark' : 'light';
            return mql.matches ? 'dark' : 'light';
          };
          const enforceTheme = () => {
            const desired = resolveTheme();
            const current = document.documentElement.getAttribute('data-theme');
            if (current !== desired) {
              document.documentElement.setAttribute('data-theme', desired);
            }
          };
          const observer = new MutationObserver((mutations) => {
            mutations.forEach((m) => {
              if (m.type === 'attributes' && m.attributeName === 'data-theme') {
                enforceTheme();
              }
            });
          });
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
          enforceTheme();
          mql.addEventListener('change', enforceTheme);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><main class="boot-shell"><i aria-hidden="true"></i><span>正在打开照护记录…</span></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
